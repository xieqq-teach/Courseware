<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病毒防护 · 交互式课件（网络版）— 登录</title>
<style>
:root {
  --primary: #2563eb;
  --primary-light: #3b82f6;
  --accent: #f59e0b;
  --bg-dark: #0f172a;
  --bg-card: #1e293b;
  --text-light: #f1f5f9;
  --text-muted: #94a3b8;
  --border: #334155;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: radial-gradient(ellipse at center, #1e3a5f 0%, #0f172a 70%);
  color: var(--text-light);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  overflow: hidden;
  position: relative;
}
/* 背景光斑 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(37,99,235,0.18) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(245,158,11,0.10) 0%, transparent 40%);
  pointer-events: none;
}
canvas#bgCanvas { position: fixed; inset: 0; z-index: 0; }
.login-card {
  position: relative; z-index: 10;
  width: 100%; max-width: 420px;
  background: rgba(30, 41, 59, 0.85);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.45);
  padding: 2.4rem 2.2rem 2rem;
  backdrop-filter: blur(8px);
}
.login-card.shake { animation: shake 0.4s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.logo-ico {
  width: 44px; height: 44px; flex: 0 0 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb, #1e40af);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(37,99,235,0.4);
}
.course-tag {
  display: inline-block;
  font-size: 12px; letter-spacing: 1px;
  color: var(--primary-light);
  border: 1px solid rgba(37,99,235,0.45);
  background: rgba(37,99,235,0.12);
  border-radius: 999px;
  padding: 2px 12px;
  margin-bottom: 14px;
}
h1 { font-size: 1.45rem; font-weight: 700; letter-spacing: .5px; }
.sub { color: var(--text-muted); font-size: 0.86rem; margin: 4px 0 22px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(15,23,42,0.65);
  color: var(--text-light);
  font-size: 1rem; font-family: inherit;
  outline: none; transition: all .25s;
}
.field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.22); }
.field input::placeholder { color: #475569; }
.pw-row { display: flex; gap: 8px; }
.pw-row input { flex: 1; }
.eye-btn {
  flex: 0 0 46px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--border); background: rgba(15,23,42,0.65);
  color: var(--text-muted); font-size: 1.05rem; transition: all .25s;
}
.eye-btn:hover { color: var(--text-light); border-color: var(--primary); }
.msg {
  min-height: 20px; font-size: 0.85rem; color: #ef4444;
  margin: -6px 0 10px; text-align: left;
}
.btn-login {
  width: 100%; padding: 12px; font-size: 1rem; font-family: inherit;
  border: none; border-radius: 10px; cursor: pointer;
  background: linear-gradient(135deg, var(--primary), #1e40af);
  color: #fff; font-weight: 600; letter-spacing: 4px;
  transition: all .25s;
  box-shadow: 0 6px 20px rgba(37,99,235,0.35);
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(37,99,235,0.5); }
.btn-login:active { transform: translateY(0); }
.btn-login[disabled] { opacity: .6; cursor: wait; transform: none; }
.tips {
  margin-top: 18px; padding-top: 14px;
  border-top: 1px dashed var(--border);
  font-size: 0.78rem; color: var(--text-muted);
  line-height: 1.9; text-align: center;
}
.tips b { color: var(--accent); font-weight: 600; }
.footer-note { margin-top: 10px; text-align: center; font-size: 0.75rem; color: #475569; }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="login-card" id="loginCard">
  <div class="logo-row">
    <div class="logo-ico">
      <svg width="26" height="26" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="lg" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#93c5fd"/>
            <stop offset="100%" stop-color="#1e40af"/>
          </radialGradient>
        </defs>
        <circle cx="100" cy="100" r="55" fill="url(#lg)"/>
        <g stroke="#f1f5f9" stroke-width="7" stroke-linecap="round">
          <line x1="100" y1="18" x2="100" y2="48"/>
          <line x1="100" y1="152" x2="100" y2="182"/>
          <line x1="18" y1="100" x2="48" y2="100"/>
          <line x1="152" y1="100" x2="182" y2="100"/>
          <line x1="42" y1="42" x2="63" y2="63"/>
          <line x1="137" y1="137" x2="158" y2="158"/>
          <line x1="158" y1="42" x2="137" y2="63"/>
          <line x1="63" y1="137" x2="42" y2="158"/>
        </g>
      </svg>
    </div>
    <div>
      <h1>病毒防护 · 交互式课件</h1>
      <div class="sub">网络版 · 需登录后学习</div>
    </div>
  </div>
  <span class="course-tag">《网络系统管理与维护》</span>

  <div class="field">
    <label for="username">账号</label>
    <input type="text" id="username" placeholder="请输入账号" autocomplete="username" maxlength="32">
  </div>
  <div class="field">
    <label for="password">密码</label>
    <div class="pw-row">
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" maxlength="32">
      <button type="button" class="eye-btn" id="eyeBtn" title="显示/隐藏密码">👁</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>

  <div class="tips">
    建议使用 <b>Chrome / Edge</b> 浏览器，横屏观看体验更佳<br>
    支持键盘 <b>← →</b> 翻页，按 <b>F</b> 键全屏
  </div>
  <div class="footer-note"></div>
</div>

<script>
/* ====== 账号校验（SHA-256 摘要比对，不存明文） ====== */
var USER_HASH = '77c4f58de4724e7cc51c15d3fdc9b676a283a8149f1b580c77582b244aa72cfd';
var PASS_HASH = 'ee87046cc66ee70c82c224b7c296af596ecf7a8986f685806f4479c295342eec';

/* 纯 JS SHA-256 实现（不依赖 crypto.subtle，http 环境可用） */
function sha256(ascii) {
  function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
  var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j;
  var result = '', words = [], asciiBitLength = ascii[lengthProperty] * 8;
  var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [], primeCounter = k[lengthProperty];
  var isComposite = {};
  for (var candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
  for (i = 0; i < ascii[lengthProperty]; i++) {
    j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
  words[words[lengthProperty]] = (asciiBitLength);
  for (j = 0; j < words[lengthProperty];) {
    var w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0, 8);
    for (i = 0; i < 64; i++) {
      var w15 = w[i - 15], w2 = w[i - 2];
      var a = hash[0], e = hash[4];
      var temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0);
      var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (i = 0; i < 8; i++) {
      hash[i] = (hash[i] + oldHash[i]) | 0;
    }
  }
  for (i = 0; i < 8; i++) {
    for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

var loginCard = document.getElementById('loginCard');
var usernameEl = document.getElementById('username');
var passwordEl = document.getElementById('password');
var msgEl = document.getElementById('msg');
var loginBtn = document.getElementById('loginBtn');

/* 已登录则直接进入课件 */
try {
  if (sessionStorage.getItem('bd_net_auth') === 'ok') {
    location.replace('courseware.html');
  }
} catch (e) {}

function doLogin() {
  var u = usernameEl.value.trim();
  var p = passwordEl.value;
  if (!u || !p) {
    msgEl.textContent = '请输入账号和密码';
    fail();
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = '正在验证…';
  setTimeout(function () {
    if (sha256(u) === USER_HASH && sha256(p) === PASS_HASH) {
      try { sessionStorage.setItem('bd_net_auth', 'ok'); } catch (e) {}
      msgEl.style.color = '#10b981';
      msgEl.textContent = '登录成功，正在进入课件…';
      setTimeout(function () { location.href = 'courseware.html'; }, 500);
    } else {
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      msgEl.style.color = '#ef4444';
      msgEl.textContent = '账号或密码错误，请重新输入';
      fail();
    }
  }, 350);
}

function fail() {
  loginCard.classList.remove('shake');
  void loginCard.offsetWidth;
  loginCard.classList.add('shake');
}

document.getElementById('eyeBtn').onclick = function () {
  passwordEl.type = (passwordEl.type === 'password') ? 'text' : 'password';
  passwordEl.focus();
};
passwordEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
usernameEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') passwordEl.focus(); });

/* 背景二进制雨 */
(function () {
  var canvas = document.getElementById('bgCanvas');
  var ctx = canvas.getContext('2d');
  var fontSize = 16, columns, drops;
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(0).map(function () { return Math.random() * -50; });
  }
  resize();
  window.addEventListener('resize', resize);
  var chars = '01病毒防护';
  setInterval(function () {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.12)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    for (var i = 0; i < drops.length; i++) {
      var text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = (text === '病毒') ? 'rgba(239,68,68,0.55)' : 'rgba(37,99,235,0.45)';
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 60);
})();
</script>
</body>
</html>
